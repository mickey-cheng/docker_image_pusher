```yaml
name: Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 查看清理前磁盘空间
      # ============================================================
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      # ============================================================
      # 2. 增加可用磁盘空间
      # ============================================================
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'

          # 如果空间仍然不够，可以开启以下选项
          # remove-android: 'true'
          # remove-codeql: 'true'

          build-mount-path: '/var/lib/docker/'

      # ============================================================
      # 3. 重启 Docker
      # ============================================================
      - name: Restart Docker
        run: |
          sudo service docker restart

      # ============================================================
      # 4. 查看清理后的磁盘空间
      # ============================================================
      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      # ============================================================
      # 5. 拉取当前仓库代码
      # ============================================================
      - name: Checkout Code
        uses: actions/checkout@v6

      # ============================================================
      # 6. 拉取镜像并推送到阿里云镜像仓库
      # ============================================================
      - name: Pull and push images to Aliyun
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "登录阿里云容器镜像仓库..."

          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login \
            --username "$ALIYUN_REGISTRY_USER" \
            --password-stdin \
            "$ALIYUN_REGISTRY"

          echo "阿里云容器镜像仓库登录成功"

          # ========================================================
          # 数据预处理
          # 判断 images.txt 中是否存在同名但不同命名空间的镜像
          #
          # 例如：
          #   linuxserver/nginx:latest
          #   nginx/nginx:latest
          #
          # 如果存在，则推送到阿里云时增加原命名空间前缀
          # ========================================================

          declare -A duplicate_images
          declare -A temp_map

          while IFS= read -r line || [ -n "$line" ]; do

              # 去除 CR，兼容 Windows CRLF
              line="${line//$'\r'/}"

              # 忽略空行
              [[ -z "$line" ]] && continue

              # 忽略注释行
              [[ "$line" =~ ^[[:space:]]*# ]] && continue

              # 获取镜像完整名称
              # 例如：
              #   kasmweb/nginx:1.25.3
              #   --platform=linux/amd64 nginx:latest
              image=$(echo "$line" | awk '{print $NF}')

              # 删除 digest
              # 例如：
              # nginx@sha256:xxxx
              # =>
              # nginx
              image="${image%%@*}"

              echo "image: $image"

              # 获取：
              # nginx:1.25.3
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')

              echo "image_name_tag: $image_name_tag"

              # 获取命名空间
              #
              # kasmweb/nginx        => kasmweb
              # docker.io/nginx     => docker.io
              # docker.io/a/nginx   => a
              # nginx               => 空
              name_space=$(echo "$image" | awk -F'/' '{
                  if (NF==3)
                      print $2;
                  else if (NF==2)
                      print $1;
                  else
                      print ""
              }')

              echo "name_space: $name_space"

              # 防止空值影响后续判断
              compare_name_space="${name_space}_"

              # 获取镜像名
              # nginx:1.25.3
              # =>
              # nginx
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

              echo "image_name: $image_name"

              # 判断是否存在同名但不同 namespace 的镜像
              if [[ -n "${temp_map[$image_name]:-}" ]]; then

                  if [[ "${temp_map[$image_name]}" != "$compare_name_space" ]]; then

                      echo "发现重名镜像: $image_name"

                      duplicate_images[$image_name]="true"

                  fi

              else

                  temp_map[$image_name]="$compare_name_space"

              fi

          done < images.txt


          echo ""
          echo "=============================================================================="
          echo "开始同步 Docker 镜像"
          echo "=============================================================================="


          # ========================================================
          # 正式处理 images.txt
          # ========================================================

          while IFS= read -r line || [ -n "$line" ]; do

              # 去除 Windows CRLF 中的 CR
              line="${line//$'\r'/}"

              # 忽略空行
              [[ -z "$line" ]] && continue

              # 忽略注释
              [[ "$line" =~ ^[[:space:]]*# ]] && continue


              echo ""
              echo "=============================================================================="
              echo "开始处理: $line"
              echo "=============================================================================="


              # ====================================================
              # 拉取镜像
              # ====================================================

              echo "执行: docker pull $line"

              # 这里故意不加双引号
              # 因为 line 可能包含：
              #
              # --platform linux/amd64 nginx:latest
              #
              # shellcheck disable=SC2086
              docker pull $line


              # ====================================================
              # 获取 platform
              # ====================================================

              platform=$(echo "$line" \
                | awk -F'--platform[ =]' '{if (NF>1) print $2}' \
                | awk '{print $1}')

              echo "platform: ${platform:-default}"


              # 如果指定了架构，则添加架构前缀
              #
              # linux/amd64
              # =>
              # linux_amd64_
              #
              if [[ -z "$platform" ]]; then

                  platform_prefix=""

              else

                  platform_prefix="${platform//\//_}_"

              fi

              echo "platform_prefix: $platform_prefix"


              # ====================================================
              # 获取镜像名称
              # ====================================================

              image=$(echo "$line" | awk '{print $NF}')

              echo "source image: $image"


              # 获取：
              # nginx:latest
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')


              # 获取 namespace
              name_space=$(echo "$image" | awk -F'/' '{
                  if (NF==3)
                      print $2;
                  else if (NF==2)
                      print $1;
                  else
                      print ""
              }')


              # 获取镜像名称
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')


              # ====================================================
              # 判断是否需要 namespace 前缀
              # ====================================================

              name_space_prefix=""

              if [[ -n "${duplicate_images[$image_name]:-}" ]]; then

                  if [[ -n "$name_space" ]]; then

                      name_space_prefix="${name_space}_"

                  fi

              fi


              # ====================================================
              # 删除 digest
              # ====================================================

              image_name_tag="${image_name_tag%%@*}"


              # ====================================================
              # 生成阿里云镜像名称
              # ====================================================

              new_image="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${platform_prefix}${name_space_prefix}${image_name_tag}"

              echo ""
              echo "源镜像:"
              echo "  $image"

              echo "目标镜像:"
              echo "  $new_image"


              # ====================================================
              # Tag
              # ====================================================

              echo ""
              echo "执行 docker tag..."

              docker tag "$image" "$new_image"


              # ====================================================
              # Push
              # ====================================================

              echo ""
              echo "执行 docker push..."

              docker push "$new_image"


              # ====================================================
              # 清理磁盘
              # ====================================================

              echo ""
              echo "开始清理磁盘空间"

              echo "=============================================================================="

              df -hT

              echo "=============================================================================="


              docker rmi "$image" || true

              docker rmi "$new_image" || true

              # 清理无用镜像层
              docker image prune -f || true


              echo ""
              echo "磁盘空间清理完毕"

              echo "=============================================================================="

              df -hT

              echo "=============================================================================="


              echo ""
              echo "镜像同步完成:"
              echo "  $image"
              echo "  ->"
              echo "  $new_image"

          done < images.txt


          # ========================================================
          # 全部完成
          # ========================================================

          echo ""
          echo "=============================================================================="
          echo "所有 Docker 镜像同步完成"
          echo "=============================================================================="

          docker logout "$ALIYUN_REGISTRY" || true
```
